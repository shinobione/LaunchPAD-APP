<!doctype html><meta charset="utf-8"><title>Layout regression</title>
<div id="result">LAYOUT PENDING</div>
<iframe id="desktop" data-src="../?visual-test=1#home" style="width:1440px;height:1000px;border:0"></iframe>
<iframe id="mobile" data-src="../?visual-test=1#home" style="width:390px;height:844px;border:0"></iframe>
<iframe id="track" data-src="../?visual-test=1#track=thick" style="width:1280px;height:1000px;border:0"></iframe>
<iframe id="mobile-album" data-src="../?visual-test=1#album=singles" style="width:390px;height:1000px;border:0"></iframe>
<script>
const result=document.querySelector('#result');
const READY=['LAYOUT','READY'].join(' ');
const ERROR=['LAYOUT','ERROR'].join(' ');
const BUILD='20260805-fixed-shell';
const frames=[...document.querySelectorAll('iframe')];
const sleep=delay=>new Promise(resolve=>setTimeout(resolve,delay));
const rect=node=>node?.getBoundingClientRect();
const localStyles=document=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(link=>new URL(link.href,document.location.href)).filter(url=>url.origin===document.location.origin&&url.pathname.includes('/css/'));
const whenLoaded=frame=>new Promise(resolve=>frame.addEventListener('load',()=>resolve(frame),{once:true}));
const whenReady=frame=>new Promise(resolve=>{
  const done=()=>{clearTimeout(timeout);frame.contentWindow.removeEventListener('shinobi:ready',done);resolve(frame);};
  const timeout=setTimeout(()=>{frame.dataset.appReadyTimeout='true';done();},1800);
  frame.contentWindow.addEventListener('shinobi:ready',done,{once:true});
  if(frame.contentDocument.documentElement.dataset.appReady==='true') done();
});
async function loadFrames(){
  const loading=frames.map(whenLoaded);
  frames.forEach(frame=>{frame.src=frame.dataset.src;});
  return Promise.all((await Promise.all(loading)).map(whenReady));
}
loadFrames().then(async([desktop,mobile,trackFrame,mobileAlbum])=>{
  await sleep(1800);
  const dd=desktop.contentDocument,md=mobile.contentDocument,td=trackFrame.contentDocument,ad=mobileAlbum.contentDocument;
  const failures=[];
  const expectedStyles=['style.css','header.css','refinements.css','lyrics.css','fixes-v2.css','content-v4.css','desktop-hero-wide.css','mobile-top-cleanup.css','mobile-navigation.css','launchpad-features.css','about-enhancements.css','library-memory.css','pwa.css','visual-card.css','track-detail.css','feature-11.css','feature-12.css'];

  for(const document of [dd,md]){
    const styles=localStyles(document);
    const names=styles.map(url=>url.pathname.split('/').pop());
    const duplicates=names.filter((name,index)=>names.indexOf(name)!==index);
    if(duplicates.length) failures.push(`duplicate-css-${[...new Set(duplicates)].join('-')}`);
    expectedStyles.forEach(name=>{if(!names.includes(name)) failures.push(`missing-initial-css-${name}`);});
    if(!styles.every(url=>url.searchParams.get('v')===BUILD)) failures.push('unversioned-initial-css');
  }

  const appReady=dd.documentElement.dataset.appReady==='true'&&md.documentElement.dataset.appReady==='true';
  if(!appReady) failures.push('app-ready-state');
  if(!dd.querySelector('.artist-manifesto')||!md.querySelector('.artist-manifesto')) failures.push('initial-final-manifesto');

  const banner=dd.querySelector('.hero-banner-art');
  const wordmark=dd.querySelector('.hero-wordmark');
  const profile=dd.querySelector('.hero-profile-card>img');
  const mobileBanner=md.querySelector('.hero-banner-art');
  const mobileProfile=md.querySelector('.hero-profile-card>img');
  if(banner?.getAttribute('width')!=='2048'||banner?.getAttribute('height')!=='1143') failures.push('banner-intrinsic-size');
  if(wordmark?.getAttribute('width')!=='720'||wordmark?.getAttribute('height')!=='330') failures.push('wordmark-intrinsic-size');
  if(profile?.getAttribute('width')!=='500'||profile?.getAttribute('height')!=='500') failures.push('profile-intrinsic-size');
  for(const [label,document,bannerNode,profileNode] of [['desktop',dd,banner,profile],['mobile',md,mobileBanner,mobileProfile]]){
    const bannerRect=rect(bannerNode),profileRect=rect(profileNode),bannerStyle=bannerNode?document.defaultView.getComputedStyle(bannerNode):null;
    if(!bannerRect||bannerRect.width<260||bannerRect.height<140||bannerStyle?.visibility==='hidden'||Number(bannerStyle?.opacity||0)<.9) failures.push(`${label}-launchpad-visible`);
    if(!profileRect||profileRect.width<70||profileRect.height<90||profileRect.height>260||Math.abs(profileRect.width/profileRect.height-.8)>.04) failures.push(`${label}-profile-ratio`);
  }

  const mobileHero=md.querySelector('.launchpad-hero');
  const mobileBodyRect=rect(md.querySelector('.launchpad-hero .hero-body'));
  const mobileRailRect=rect(md.querySelector('.launchpad-hero .launchpad-banner-rail'));
  if(!mobileHero||!mobileBodyRect||!mobileRailRect||mobileRailRect.top>=mobileBodyRect.top) failures.push('mobile-launchpad-banner-order');

  const shell=rect(dd.querySelector('.app-shell'));
  const sidebarNode=dd.querySelector('.sidebar');
  const playerNode=dd.querySelector('.player-bar');
  const mainScroller=dd.querySelector('.main-content');
  const sidebar=rect(sidebarNode);
  const player=rect(playerNode);
  const desktopGrid=dd.querySelectorAll('#featured-grid .album-card').length;
  const mobileNav=rect(md.querySelector('.mobile-nav'));
  const mobilePlayer=rect(md.querySelector('.player-bar'));
  const homePanels=rect(dd.querySelector('.home-panels'));
  if(!sidebar||sidebar.width<170||sidebar.width>280) failures.push('desktop-sidebar');
  if(!player||player.height<65||player.height>110||player.bottom<980) failures.push('desktop-player');
  if(!shell||Math.abs(shell.height-desktop.contentWindow.innerHeight)>2) failures.push('desktop-shell-height');
  if(!mainScroller||mainScroller.scrollHeight<=mainScroller.clientHeight+20) failures.push('desktop-main-not-scrollable');
  if(sidebar&&player&&Math.abs(sidebar.right-player.left)>2) failures.push('desktop-player-sidebar-gap');
  if(sidebar&&Math.abs(sidebar.bottom-desktop.contentWindow.innerHeight)>2) failures.push('desktop-sidebar-viewport');
  if(player&&Math.abs(player.bottom-desktop.contentWindow.innerHeight)>2) failures.push('desktop-player-viewport');
  const htmlOverflow=desktop.contentWindow.getComputedStyle(dd.documentElement).overflowY;
  const bodyOverflow=desktop.contentWindow.getComputedStyle(dd.body).overflowY;
  if(htmlOverflow!=='hidden'||bodyOverflow!=='hidden') failures.push('desktop-root-scroll-lock');

  const sidebarBefore=rect(sidebarNode);
  const playerBefore=rect(playerNode);
  desktop.contentWindow.scrollTo(0,320);
  mainScroller.scrollTop=320;
  await sleep(120);
  const sidebarAfter=rect(sidebarNode);
  const playerAfter=rect(playerNode);
  if(Math.abs(desktop.contentWindow.scrollY)>1) failures.push('desktop-window-scrolled');
  if(mainScroller.scrollTop<100) failures.push('desktop-main-scroll-owner');
  if(!sidebarBefore||!sidebarAfter||Math.abs(sidebarBefore.top-sidebarAfter.top)>1||Math.abs(sidebarBefore.bottom-sidebarAfter.bottom)>1) failures.push('desktop-sidebar-moved');
  if(!playerBefore||!playerAfter||Math.abs(playerBefore.top-playerAfter.top)>1||Math.abs(playerBefore.bottom-playerAfter.bottom)>1) failures.push('desktop-player-moved');
  mainScroller.scrollTop=0;

  if(desktopGrid!==4) failures.push('featured-grid');
  if(!homePanels||homePanels.width<800) failures.push('home-panels');
  if(!mobileNav||mobileNav.height<45||mobileNav.height>75||mobileNav.bottom<830) failures.push('mobile-nav');
  if(!mobilePlayer||mobilePlayer.height<55||mobilePlayer.height>95||mobilePlayer.bottom>800) failures.push('mobile-player');

  md.querySelector('[data-view="about"]')?.click();
  await sleep(300);
  const mobileAbout=md.querySelector('#view-about');
  const mobileAboutPortrait=rect(md.querySelector('#view-about .about-card>img'));
  const mobileAboutEyebrow=rect(md.querySelector('#view-about .page-intro .eyebrow'));
  const mobileMenuButton=rect(md.querySelector('#menu-button'));
  if(!mobileAbout?.classList.contains('active')) failures.push('mobile-about-route');
  if(!mobileAboutPortrait||mobileAboutPortrait.width<150||mobileAboutPortrait.width>190||mobileAboutPortrait.height<210||mobileAboutPortrait.height>240||Math.abs(mobileAboutPortrait.width/mobileAboutPortrait.height-.8)>.04) failures.push('mobile-about-portrait');
  if(!mobileAboutEyebrow||!mobileMenuButton||mobileAboutEyebrow.top<mobileMenuButton.bottom+12) failures.push('mobile-about-menu-clearance');

  const directAudio=td.querySelector('#audio');
  const metadataLabels=[...td.querySelectorAll('.track-detail-data-item>span')].map(node=>node.textContent.trim());
  const directTags=td.querySelectorAll('.track-detail-tags span').length;
  const directHero=rect(td.querySelector('.track-detail-hero'));
  if(!td.querySelector('#view-track.active')) failures.push('track-direct-route');
  if(!directAudio?.paused) failures.push('track-direct-autoplay');
  if(td.querySelector('.track-detail-copy h1')?.textContent.trim()!=='THICK') failures.push('track-title');
  for(const label of ['BPM','Key','Key analysis','Language','Genre','Mood','Project','Release date','Duration','Content rating','Lyrics','Catalog ID','Primary accent','Secondary accent']) if(!metadataLabels.includes(label)) failures.push(`track-meta-${label.toLowerCase().replaceAll(' ','-')}`);
  if(directTags<2) failures.push('track-tags');
  if(!directHero||directHero.width<700) failures.push('track-hero');

  const cover=dd.querySelector('#featured-grid img[data-track-cover-link="ghost-signal"]');
  const homeAudio=dd.querySelector('#audio');
  let navigationLoadCalls=0;
  if(!cover||!homeAudio) failures.push('cover-link');
  else{
    homeAudio.dataset.trackId='thick';
    Object.defineProperty(homeAudio,'paused',{value:false,configurable:true});
    Object.defineProperty(homeAudio,'currentTime',{value:37,writable:true,configurable:true});
    homeAudio.load=()=>{navigationLoadCalls+=1;};
    cover.click();
    await sleep(300);
    if(desktop.contentWindow.location.hash!=='#track=ghost-signal') failures.push('cover-navigation');
    if(!dd.querySelector('#view-track.active')) failures.push('cover-track-view');
    if(homeAudio.dataset.trackId!=='thick') failures.push('cover-changed-playing-track');
    if(homeAudio.paused) failures.push('cover-paused-playback');
    if(Math.abs(homeAudio.currentTime-37)>.01) failures.push('cover-reset-playback-position');
    if(navigationLoadCalls!==0) failures.push('cover-reloaded-audio');
    if(desktop.contentWindow.history.state?.shinobiTrackDetail!==true) failures.push('cover-passive-history-state');
  }

  const albumRows=[...ad.querySelectorAll('.album-detail-track')];
  if(albumRows.length!==1) failures.push('mobile-album-track-count');
  albumRows.forEach((row,index)=>{
    const rowRect=rect(row),playRect=rect(row.querySelector('.album-detail-play'));
    if(!rowRect||!playRect){failures.push(`mobile-album-play-${index+1}-missing`);return;}
    if(Math.abs((rowRect.top+rowRect.height/2)-(playRect.top+playRect.height/2))>5) failures.push(`mobile-album-play-${index+1}-vertical`);
    if(playRect.right<rowRect.right-28||playRect.left<rowRect.right-70) failures.push(`mobile-album-play-${index+1}-right`);
  });

  const trackNavigationPreserved=navigationLoadCalls===0&&homeAudio?.dataset.trackId==='thick';
  const fixedDesktopShell=Math.abs(desktop.contentWindow.scrollY)<=1&&mainScroller?.scrollHeight>mainScroller?.clientHeight&&Math.abs((sidebar?.right||0)-(player?.left||0))<=2;
  const snapshot={sidebarWidth:Math.round(sidebar?.width||0),playerHeight:Math.round(player?.height||0),homePanelsWidth:Math.round(homePanels?.width||0),mobileNavHeight:Math.round(mobileNav?.height||0),mobilePlayerHeight:Math.round(mobilePlayer?.height||0),featured:desktopGrid,trackMetadata:metadataLabels.length,trackTags:directTags,mobileAlbumRows:albumRows.length,mobileAboutPortrait:mobileAboutPortrait?`${Math.round(mobileAboutPortrait.width)}x${Math.round(mobileAboutPortrait.height)}`:'missing',mobileLaunchpadFirst:Boolean(mobileRailRect&&mobileBodyRect&&mobileRailRect.top<mobileBodyRect.top),fixedDesktopShell,initialStyles:localStyles(dd).length,appReadyTimeouts:frames.filter(frame=>frame.dataset.appReadyTimeout==='true').length,appReady,trackNavigationPreserved};
  result.textContent=failures.length?`${ERROR} ${failures.join(' ')}`:`${READY} ${JSON.stringify(snapshot)}`;
}).catch(error=>{result.textContent=`${ERROR} harness-${String(error?.message||error).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}`;});
</script>
