<!doctype html><meta charset="utf-8"><title>Layout regression</title>
<div id="result">LAYOUT PENDING</div>
<iframe id="desktop" src="../?visual-test=1#home" style="width:1440px;height:1000px;border:0"></iframe>
<iframe id="mobile" src="../?visual-test=1#home" style="width:390px;height:844px;border:0"></iframe>
<iframe id="track" src="../?visual-test=1#track=husband" style="width:1280px;height:1000px;border:0"></iframe>
<iframe id="mobile-album" src="../?visual-test=1#album=singles" style="width:390px;height:1000px;border:0"></iframe>
<script>
const result=document.querySelector('#result');
const READY=['LAYOUT','READY'].join(' ');
const ERROR=['LAYOUT','ERROR'].join(' ');
const frames=[document.querySelector('#desktop'),document.querySelector('#mobile'),document.querySelector('#track'),document.querySelector('#mobile-album')];
const sleep=delay=>new Promise(resolve=>setTimeout(resolve,delay));
const rect=node=>node?.getBoundingClientRect();
const geometry=document=>{
  const selectors=['.launchpad-hero','.launchpad-banner-rail','.hero-banner-art','.hero-body','.hero-wordmark'];
  return Object.fromEntries(selectors.map(selector=>{
    const box=rect(document.querySelector(selector));
    return [selector,box?{left:box.left,top:box.top,width:box.width,height:box.height}:null];
  }));
};
const maximumGeometryDelta=(before,after)=>Object.keys(before).reduce((maximum,key)=>{
  if(!before[key]||!after[key]) return Infinity;
  const delta=Math.max(...['left','top','width','height'].map(field=>Math.abs(before[key][field]-after[key][field])));
  return Math.max(maximum,delta);
},0);
const localStyles=document=>[...document.querySelectorAll('link[rel="stylesheet"]')]
  .map(link=>new URL(link.href,document.location.href))
  .filter(url=>url.origin===document.location.origin&&url.pathname.includes('/css/'));

Promise.all(frames.map(frame=>new Promise(resolve=>frame.addEventListener('load',()=>resolve(frame))))).then(async([desktop,mobile,trackFrame,mobileAlbum])=>{
  await sleep(150);
  const dd=desktop.contentDocument, md=mobile.contentDocument, td=trackFrame.contentDocument, ad=mobileAlbum.contentDocument;
  const initialDesktopGeometry=geometry(dd);
  const initialMobileGeometry=geometry(md);

  await sleep(4850);
  const failures=[];
  const finalDesktopGeometry=geometry(dd);
  const finalMobileGeometry=geometry(md);
  const desktopHeroShift=maximumGeometryDelta(initialDesktopGeometry,finalDesktopGeometry);
  const mobileHeroShift=maximumGeometryDelta(initialMobileGeometry,finalMobileGeometry);
  if(desktopHeroShift>2) failures.push(`desktop-first-paint-shift-${Math.round(desktopHeroShift)}`);
  if(mobileHeroShift>2) failures.push(`mobile-first-paint-shift-${Math.round(mobileHeroShift)}`);

  const expectedStyles=[
    'style.css','header.css','refinements.css','lyrics.css','fixes-v2.css','content-v4.css',
    'desktop-hero-wide.css','mobile-top-cleanup.css','mobile-navigation.css','launchpad-features.css',
    'about-enhancements.css','library-memory.css','pwa.css','visual-card.css','track-detail.css'
  ];
  for(const document of [dd,md]){
    const styles=localStyles(document);
    const names=styles.map(url=>url.pathname.split('/').pop());
    const duplicates=names.filter((name,index)=>names.indexOf(name)!==index);
    if(duplicates.length) failures.push(`duplicate-css-${[...new Set(duplicates)].join('-')}`);
    expectedStyles.forEach(name=>{if(!names.includes(name)) failures.push(`missing-initial-css-${name}`);});
    if(!styles.every(url=>url.searchParams.get('v')==='20260802-wave14')) failures.push('unversioned-initial-css');
  }

  if(dd.documentElement.dataset.appReady!=='true'||md.documentElement.dataset.appReady!=='true') failures.push('app-ready-state');
  if(!dd.querySelector('.artist-manifesto')||!md.querySelector('.artist-manifesto')) failures.push('initial-final-manifesto');
  const banner=dd.querySelector('.hero-banner-art');
  const wordmark=dd.querySelector('.hero-wordmark');
  const profile=dd.querySelector('.hero-profile-card>img');
  if(banner?.getAttribute('width')!=='2048'||banner?.getAttribute('height')!=='1143') failures.push('banner-intrinsic-size');
  if(wordmark?.getAttribute('width')!=='720'||wordmark?.getAttribute('height')!=='330') failures.push('wordmark-intrinsic-size');
  if(profile?.getAttribute('width')!=='500'||profile?.getAttribute('height')!=='500') failures.push('profile-intrinsic-size');

  const sidebar=rect(dd.querySelector('.sidebar'));
  const player=rect(dd.querySelector('.player-bar'));
  const desktopGrid=dd.querySelectorAll('#featured-grid .album-card').length;
  const mobileNav=rect(md.querySelector('.mobile-nav'));
  const mobilePlayer=rect(md.querySelector('.player-bar'));
  const homePanels=rect(dd.querySelector('.home-panels'));
  if(!sidebar||sidebar.width<170||sidebar.width>280) failures.push('desktop-sidebar');
  if(!player||player.height<65||player.height>110||player.bottom<980) failures.push('desktop-player');
  if(desktopGrid!==5) failures.push('featured-grid');
  if(!homePanels||homePanels.width<800) failures.push('home-panels');
  if(!mobileNav||mobileNav.height<45||mobileNav.height>75||mobileNav.bottom<830) failures.push('mobile-nav');
  if(!mobilePlayer||mobilePlayer.height<55||mobilePlayer.height>95||mobilePlayer.bottom>800) failures.push('mobile-player');

  const directView=td.querySelector('#view-track.active');
  const directAudio=td.querySelector('#audio');
  const metadataLabels=[...td.querySelectorAll('.track-detail-data-item>span')].map(node=>node.textContent.trim());
  const directTags=td.querySelectorAll('.track-detail-tags span').length;
  const directHero=rect(td.querySelector('.track-detail-hero'));
  if(!directView) failures.push('track-direct-route');
  if(!directAudio?.paused) failures.push('track-direct-autoplay');
  if(td.querySelector('.track-detail-copy h1')?.textContent.trim()!=='HUSBAND') failures.push('track-title');
  for(const label of ['BPM','Key','Key analysis','Language','Genre','Mood','Project','Release date','Duration','Content rating','Lyrics','Catalog ID','Primary accent','Secondary accent']){
    if(!metadataLabels.includes(label)) failures.push(`track-meta-${label.toLowerCase().replaceAll(' ','-')}`);
  }
  if(directTags<2) failures.push('track-tags');
  if(!directHero||directHero.width<700) failures.push('track-hero');

  const cover=dd.querySelector('#featured-grid img[data-track-cover-link="husband"]');
  const homeAudio=dd.querySelector('#audio');
  let navigationLoadCalls=0;
  if(!cover||!homeAudio) failures.push('cover-link');
  else{
    homeAudio.dataset.trackId='thick';
    Object.defineProperty(homeAudio,'paused',{value:false,configurable:true});
    Object.defineProperty(homeAudio,'currentTime',{value:37,writable:true,configurable:true});
    homeAudio.load=()=>{navigationLoadCalls+=1;};

    cover.click();
    await sleep(900);
    if(desktop.contentWindow.location.hash!=='#track=husband') failures.push('cover-navigation');
    if(!dd.querySelector('#view-track.active')) failures.push('cover-track-view');
    if(homeAudio.dataset.trackId!=='thick') failures.push('cover-changed-playing-track');
    if(homeAudio.paused) failures.push('cover-paused-playback');
    if(Math.abs(homeAudio.currentTime-37)>.01) failures.push('cover-reset-playback-position');
    if(navigationLoadCalls!==0) failures.push('cover-reloaded-audio');
    if(desktop.contentWindow.history.state?.shinobiTrackDetail!==true) failures.push('cover-passive-history-state');
  }

  const albumRows=[...ad.querySelectorAll('.album-detail-track')];
  if(albumRows.length!==4) failures.push('mobile-album-track-count');
  albumRows.forEach((row,index)=>{
    const rowRect=rect(row);
    const playRect=rect(row.querySelector('.album-detail-play'));
    if(!rowRect||!playRect){
      failures.push(`mobile-album-play-${index+1}-missing`);
      return;
    }
    const rowCenter=rowRect.top+rowRect.height/2;
    const playCenter=playRect.top+playRect.height/2;
    if(Math.abs(rowCenter-playCenter)>5) failures.push(`mobile-album-play-${index+1}-vertical`);
    if(playRect.right<rowRect.right-28||playRect.left<rowRect.right-70) failures.push(`mobile-album-play-${index+1}-right`);
  });

  const snapshot={
    sidebarWidth:Math.round(sidebar?.width||0),
    playerHeight:Math.round(player?.height||0),
    homePanelsWidth:Math.round(homePanels?.width||0),
    mobileNavHeight:Math.round(mobileNav?.height||0),
    mobilePlayerHeight:Math.round(mobilePlayer?.height||0),
    featured:desktopGrid,
    trackMetadata:metadataLabels.length,
    trackTags:directTags,
    mobileAlbumRows:albumRows.length,
    desktopHeroShift:Number(desktopHeroShift.toFixed(2)),
    mobileHeroShift:Number(mobileHeroShift.toFixed(2)),
    initialStyles:localStyles(dd).length,
    appReady:dd.documentElement.dataset.appReady==='true'&&md.documentElement.dataset.appReady==='true',
    trackNavigationPreserved:navigationLoadCalls===0&&homeAudio?.dataset.trackId==='thick'
  };
  result.textContent=failures.length?`${ERROR} ${failures.join(' ')}`:`${READY} ${JSON.stringify(snapshot)}`;
});
</script>
