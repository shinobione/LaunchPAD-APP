<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visual capture frame</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#05030b}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="app" title="SHINOBIWAN visual regression view"></iframe>
  <script>
    const frame=document.querySelector('#app');
    const view=new URLSearchParams(location.search).get('view')||'home';
    frame.src=`../?visual-test=1#${view}`;
    frame.addEventListener('load',()=>{
      const win=frame.contentWindow;
      win.requestAnimationFrame=()=>0;
      win.cancelAnimationFrame=()=>{};
      window.setTimeout(()=>document.documentElement.dataset.ready='true',1500);
    });
  </script>
</body>
</html>
