<!doctype html>
<meta charset="utf-8">
<title>SHINOBIWAN PWA smoke test</title>
<p id="status">SERVICE WORKER PENDING</p>
<script>
  const status = document.querySelector('#status');

  async function verify() {
    if (!('serviceWorker' in navigator)) throw new Error('unsupported');
    const registration = await navigator.serviceWorker.register('../sw.js', {
      scope: '../',
      updateViaCache: 'none'
    });
    await navigator.serviceWorker.ready;
    const cacheNames = await caches.keys();
    const shellReady = cacheNames.some(name => name.includes('shinobi-launchpad-v1-shell'));
    const imagesReady = cacheNames.some(name => name.includes('shinobi-launchpad-v1-images'));
    status.textContent = shellReady && imagesReady
      ? 'SERVICE WORKER READY WITH OFFLINE CACHES'
      : 'SERVICE WORKER READY WITHOUT EXPECTED CACHES';
    status.dataset.scope = registration.scope;
  }

  verify().catch(error => {
    status.textContent = `SERVICE WORKER ERROR: ${error.message}`;
  });
</script>
