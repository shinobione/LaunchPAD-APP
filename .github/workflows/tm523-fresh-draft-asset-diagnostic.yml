name: TM523 fresh draft asset diagnostic

on:
  push:
    branches:
      - diagnostic/tm523-fresh-draft-asset-upload

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build current TM v5.23 and reproduce fresh draft uploads
        run: node scripts/diagnose-tm523-fresh-draft-assets.mjs
