name: Deploy LaunchPAD to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages-custom.yml

concurrency:
  group: pages-recovery-20260806-2103
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble recovery site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name _site \
            -exec cp -a {} _site/ \;

          touch _site/.nojekyll
          test -s _site/index.html

      - name: Upload recovery artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy recovery site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
