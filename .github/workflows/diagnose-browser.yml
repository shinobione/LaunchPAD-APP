name: Diagnose browser guards

on:
  push:
    branches:
      - refactor/visual-safety-seo-accessibility
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run late browser guards
        shell: bash
        run: |
          mkdir -p artifacts/browser-diagnostics
          python3 -m http.server 4173 >/tmp/launchpad-server.log 2>&1 &
          SERVER_PID=$!
          trap 'cp /tmp/*.html /tmp/launchpad-server.log artifacts/browser-diagnostics/ 2>/dev/null || true; kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          chrome_dump() {
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget="$1" --dump-dom "$2"
          }

          echo 'CHECK accessibility'
          chrome_dump 18000 'http://127.0.0.1:4173/tests/accessibility-smoke.html' > /tmp/accessibility.html
          grep -o 'ACCESSIBILITY [^<]*' /tmp/accessibility.html || true

          echo 'CHECK layout geometry'
          chrome_dump 18000 'http://127.0.0.1:4173/tests/layout-regression.html' > /tmp/layout.html
          grep -o 'LAYOUT [^<]*' /tmp/layout.html || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/browser-diagnostics
          retention-days: 1
