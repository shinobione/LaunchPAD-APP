name: Validate Launchpad

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Validate final module migration
        run: |
          test ! -e js/ui.js
          test ! -e js/lyrics-engine.js
          test ! -e js/visual-engine.js
          test ! -e js/content-v4.js
          test ! -e js/about-enhancements.js
          test ! -e js/audio-focus.js
          test ! -e js/lyrics-wake-lock.js
          test -s js/features/ui/ui-controller.js
          test -s js/features/lyrics/lyrics-engine.js
          test -s js/features/visual/visual-engine.js
          grep -q "./features/ui/ui-controller.js" js/app-main.js
          grep -q "./features/lyrics/lyrics-engine.js" js/app-main.js
          grep -q "./features/visual/visual-engine.js" js/app-main.js
          ! grep -q "from './ui.js'" js/app-main.js
          ! grep -q "from './lyrics-engine.js'" js/app-main.js
          ! grep -q "from './visual-engine.js'" js/app-main.js

      - name: Validate catalog and referenced files
        run: npm run validate:catalog

      - name: Validate PWA manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const fail = message => { throw new Error(message); };
          if (!manifest.name || !manifest.short_name) fail('Manifest names are required.');
          if (!manifest.start_url || !manifest.scope) fail('Manifest start_url and scope are required.');
          if (!['standalone', 'fullscreen', 'minimal-ui'].includes(manifest.display)) fail('Manifest display mode is not installable.');
          for (const size of ['192x192', '512x512']) {
            const icon = manifest.icons?.find(item => String(item.sizes).split(/\s+/).includes(size));
            if (!icon) fail(`Missing ${size} icon.`);
            if (!fs.existsSync(icon.src)) fail(`Missing icon file ${icon.src}.`);
          }
          const worker = fs.readFileSync('sw.js', 'utf8');
          if (!worker.includes("request.destination === 'audio'")) fail('Audio requests are not explicitly excluded from cache.');
          if (!worker.includes("request.headers.has('range')")) fail('Range requests are not explicitly excluded from cache.');
          for (const resource of [
            "'./js/features/ui/ui-controller.js'",
            "'./js/features/lyrics/lyrics-engine.js'",
            "'./js/features/visual/visual-engine.js'",
            "'./js/features/visual-card.js'",
            "'./css/visual-card.css'",
            "'./css/album-duration.css'"
          ]) {
            if (!worker.includes(resource)) fail(`Offline shell is missing ${resource}.`);
          }
          for (const removed of ["'./js/ui.js'", "'./js/lyrics-engine.js'", "'./js/visual-engine.js'"]) {
            if (worker.includes(removed)) fail(`Offline shell still references removed path ${removed}.`);
          }
          console.log('PWA manifest, migrated shell and audio cache exclusions are valid.');
          NODE

      - name: Validate offline service worker behavior
        run: node scripts/test-service-worker.mjs

      - name: Smoke test in headless Chrome
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/launchpad-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:4173/#home' > /tmp/launchpad-home.html

          grep -q 'id="queue-panel"' /tmp/launchpad-home.html
          grep -q 'id="view-favorites"' /tmp/launchpad-home.html
          grep -q 'data-favorite-toggle="ghost-signal"' /tmp/launchpad-home.html
          grep -q 'data-favorite-current="true"' /tmp/launchpad-home.html
          grep -q 'id="visual-card-modal"' /tmp/launchpad-home.html
          grep -q 'data-visual-card-action="open"' /tmp/launchpad-home.html
          grep -q 'rel="manifest" href="manifest.webmanifest' /tmp/launchpad-home.html
          grep -q 'id="pwa-install-control"' /tmp/launchpad-home.html
          grep -q '14 TRACKS' /tmp/launchpad-home.html
          grep -q 'Ghost Signal' /tmp/launchpad-home.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-home.html

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=9000 --dump-dom \
            'http://127.0.0.1:4173/#favorites' > /tmp/launchpad-favorites.html

          grep -q 'id="view-favorites" class="view memory-view active"' /tmp/launchpad-favorites.html
          grep -q 'Your favorites' /tmp/launchpad-favorites.html
          grep -q 'Recently played' /tmp/launchpad-favorites.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-favorites.html

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/launchpad-memory-profile \
            --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:4173/tests/memory-smoke.html' > /tmp/launchpad-memory.html

          grep -q '<strong id="player-title">Ghost Signal</strong>' /tmp/launchpad-memory.html
          grep -q 'data-favorite-toggle="ghost-signal"' /tmp/launchpad-memory.html
          grep -q 'Close to You' /tmp/launchpad-memory.html
          grep -q 'data-repeat="one"' /tmp/launchpad-memory.html
          grep -q 'class="chip active" data-visual="pulse"' /tmp/launchpad-memory.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-memory.html

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=20000 --dump-dom \
            'http://127.0.0.1:4173/tests/visual-card-smoke.html' > /tmp/launchpad-visual-card.html

          grep -q 'VISUAL CARD READY 1080x1080 GHOST SIGNAL' /tmp/launchpad-visual-card.html
          ! grep -q 'VISUAL CARD ERROR' /tmp/launchpad-visual-card.html

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=20000 --dump-dom \
            'http://127.0.0.1:4173/#album=coal-to-diamond' > /tmp/launchpad-album.html

          grep -q 'album-detail-hero' /tmp/launchpad-album.html
          grep -q 'Play album' /tmp/launchpad-album.html
          grep -q 'The Throne Resonates' /tmp/launchpad-album.html
          grep -q 'data-album-total-duration' /tmp/launchpad-album.html
          grep -q 'data-album-track-duration="the-throne-resonates"' /tmp/launchpad-album.html
          grep -Eq '[0-9]+:[0-9]{2} total' /tmp/launchpad-album.html
          grep -Eq 'data-album-track-duration="the-throne-resonates"[^>]*>[0-9]+:[0-9]{2}<' /tmp/launchpad-album.html
          ! grep -q 'Duration unavailable' /tmp/launchpad-album.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-album.html

          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=9000 --dump-dom \
            'http://127.0.0.1:4173/#lyrics=before-the-noise' > /tmp/launchpad-lyrics.html

          grep -q 'Studio mode' /tmp/launchpad-lyrics.html
          grep -q 'Before the Noise' /tmp/launchpad-lyrics.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-lyrics.html
