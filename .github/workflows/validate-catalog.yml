name: Validate catalog

on:
  push:
    branches: [main, refactor/launchpad-waves]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate catalog and referenced files
        run: npm run validate:catalog
