name: Validate Launchpad

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-launchpad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Validate deployment topology
        run: npm run check:deployment-topology

      - name: Validate build documentation coherence
        run: npm run check:build-docs

      - name: Validate catalog core contracts
        run: |
          node scripts/validate-catalog.mjs
          node scripts/validate-hero-layout.mjs
          node scripts/validate-legacy-catalog-merge.mjs
          node scripts/validate-favorites-queue.mjs

      - name: Validate catalog feature contracts
        run: |
          npm run check:catalog-filters
          npm run check:feature-10
          npm run check:feature-11
          npm run check:phase-12

      - name: Validate Audio Lab and phase contracts
        run: |
          npm run check:phase-13
          npm run check:milestone-7
          npm run check:navigation-recovery
          npm run check:sanctuary-idempotence
          npm run check:audiolab-signal
          npm run check:audiolab-core-modes
          npm run check:audiolab-live

      - name: Validate catalog desktop overflow contract
        run: npm run check:desktop-overflow

      - name: Validate master specification guards
        run: node scripts/test-master-spec.mjs

      - name: Validate PWA and service-worker behavior
        run: npm run test:service-worker

      - name: Smoke navigation recovery in Chrome
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/launchpad-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -TERM -f 'google-chrome.*127.0.0.1:4173' 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 2

          CHROME_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-gpu
            --disable-dev-shm-usage
            --disable-background-networking
            --disable-component-update
            --disable-default-apps
            --disable-extensions
            --no-first-run
            --mute-audio
            --hide-scrollbars
            --js-flags=--max-old-space-size=768
          )

          timeout --signal=TERM --kill-after=5s 45s \
            google-chrome "${CHROME_FLAGS[@]}" \
            --virtual-time-budget=12000 --dump-dom \
            'http://127.0.0.1:4173/?visual-test=1#home' \
            > /tmp/launchpad-home.html

          grep -q 'data-app-ready="true"' /tmp/launchpad-home.html
          grep -q 'home-official-release' /tmp/launchpad-home.html
          grep -q 'data-home-visual-mode="neon-ribbon"' /tmp/launchpad-home.html
          ! grep -q 'An error is preventing the application from loading' /tmp/launchpad-home.html

          timeout --signal=TERM --kill-after=5s 45s \
            google-chrome "${CHROME_FLAGS[@]}" \
            --virtual-time-budget=14000 --dump-dom \
            'http://127.0.0.1:4173/tests/accessibility-smoke.html' \
            > /tmp/accessibility.html

          grep -q 'ACCESSIBILITY READY' /tmp/accessibility.html
          ! grep -q 'ACCESSIBILITY ERROR' /tmp/accessibility.html

      - name: Upload Chrome diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-ci-diagnostics
          path: |
            /tmp/launchpad-server.log
            /tmp/launchpad-home.html
            /tmp/accessibility.html
          if-no-files-found: ignore
          retention-days: 7
