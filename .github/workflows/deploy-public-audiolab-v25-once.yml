name: Verify Public Media Worker v2.5 Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-public-audiolab-v25-once.yml

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_WORKER_URL: https://launchpad-media.jerryquinet.workers.dev
      EXPECTED_PUBLIC_VERSION: '2.5'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public media CORS, Range and streaming
        run: node scripts/verify-cloudflare-deployment.mjs public
