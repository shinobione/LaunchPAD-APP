name: TM v5.24 docs closeout one-shot

on:
  push:
    branches:
      - docs/tm524-real-user-closeout-20260816

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tm524-real-user-closeout-20260816
      - name: Patch current-state docs exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,t): Path(p).write_text(t,encoding='utf-8')
          def rb(t,a,b,new,label):
              i=t.find(a); j=t.find(b,i+len(a))
              if i<0 or j<0: raise SystemExit(f'missing {label}')
              return t[:i]+new+t[j:]
          def ro(t,old,new,label):
              if t.count(old)!=1: raise SystemExit(f'{label}: {t.count(old)}')
              return t.replace(old,new,1)

          p='README.md'; t=read(p)
          current='''## Current production / accepted state\n\n```text\nLaunchPAD accepted    2026.08.12.102\nRelease               phase-ux-c3-c11-visual-card-feedback-20260812\nC3-C status           COMPLETE · REAL USER PASS\n\nPublic Worker         v2.7 · unchanged\nWorker Version ID     ddd90621-35d4-44b0-9c22-4e5a72291d9b\nTrack Manager         v5.24 · REAL USER VERIFIED\nTM Worker Version ID  53abb651-4f3c-46a7-a37a-055f35d340b9\nStudio bridge         v1.14\nStudio accepted       v0.19.20 · Build98 · Phase 9 Slice17 · REAL USER PASS\nTrack-To-Market       v0.1.5 · Bridge V2 · REAL USER PASS\nSonicTrace            V2-E Build 08 · REAL USER PASS\nDeep Audio            2.0.3-alpha\nLRC Maker             6.3.8\n\nAlbum authority       canonical-r2\nSingles               virtual collection\n```\n\nBuild 102 remains the accepted LaunchPAD public UX baseline. Public Worker v2.7 was not redeployed by the TM v5.24 corrective.\n\nTrack Manager v5.24 / Studio bridge v1.14 is the current accepted private admin Worker. It fixes the generated-bundle scope defect that left `uploadEvidence` undeclared inside Track asset upload while preserving the existing guarded R2 transaction, canonical reread and rollback model. Protected deployment run `31919397012` deployed **admin only** from source `aaa28c90c95b6d5dbe76e34a840d95e194e0cc65`, produced Worker Version ID `53abb651-4f3c-46a7-a37a-055f35d340b9`, passed post-deploy Cloudflare Access verification, and skipped Public Worker deployment.\n\nReal-user continuation on the genuine `Pixels & Promises` draft then successfully committed MP3, cover JPEG, MP4 and TXT assets with no recurrence of `ASSET_SAVE_ROLLBACK · HTTP 500`. Explicit verdict: **`MP3 + COVER + MP4 + TXT PASS MADAFAKA`** on 2026-08-16.\n\nThis README is the current-state map. Historical build-by-build implementation detail remains in dedicated docs/changelogs and Git history.\n\n'''
          t=rb(t,'## Current production / accepted state\n\n','## PHASE UX C2.5 — status\n\n',current,'README current state')
          old='''Current handoff:\n\n```text\nLaunchPAD C3-C          COMPLETE · Build 102 REAL USER PASS\nTrack-To-Market Build45 COMPLETE · Bridge V2 REAL USER PASS\nPhase 7-A               Studio Build 46 REAL USER PASS\nPhase 7-B               Studio Build 51 REAL USER PASS\nStudio Focus Slices 1–4 through Build 61 REAL USER PASS\nStudio Focus closeout   Studio Build 62 REAL USER PASS\nFoundation Repair       Studio Build 67 + TM5.21 REAL USER PASS\nHome lead corrective    Studio Build 68 REAL USER PASS\nPhase 7-C Slice 1       Studio Build 71 REAL USER PASS\nPhase 7-C Slice 2       Studio Build 73 REAL USER PASS\nPhase 7-C Program       COMPLETE · no Slice3 runtime required\nPhase 8 Slice 1         Studio Build 74 REAL USER PASS\nNext Studio build       Build75 unused · fresh Phase8 audit required\nTrack Manager           v5.22 · Studio bridge v1.12\n```'''
          new='''Current handoff:\n\n```text\nLaunchPAD C3-C          COMPLETE · Build 102 REAL USER PASS\nTrack-To-Market Build45 COMPLETE · Bridge V2 REAL USER PASS\nPhase 7-A / 7-B / 7-C   COMPLETE · REAL USER PASS / program closeout\nPhase 8                 COMPLETE · Build81 closeout\nPhase 9 Slice1–15       Build82–Build96 · REAL USER PASS\nPhase 9 Slice16         Studio Build97 · REAL USER PASS\nPhase 9 Slice17         Studio Build98 · REAL USER PASS\nTrack Manager           v5.24 · Studio bridge v1.14 · REAL USER VERIFIED\nTM admin Worker         53abb651-4f3c-46a7-a37a-055f35d340b9\nPublic Worker           v2.7 · unchanged\nNext Studio build       Build99 UNALLOCATED · fresh read-only audit required\n```'''
          t=ro(t,old,new,'README handoff')
          write(p,t)

          p='docs/TM-V5.24-TRACK-ASSET-EVIDENCE-SCOPE-CORRECTIVE.md'; t=read(p)
          t=ro(t,'Status: **IMPLEMENTED CANDIDATE · CI PENDING · NOT DEPLOYED**','Status: **DEPLOYED · REAL USER VERIFIED · ACCEPTED CORRECTIVE**','TM status')
          old='''## Safety\n\n```text\nCanonical LaunchPAD main  bc82fea12edc7cbd1b7b054c697a553694e76322\nSafety checkpoint         safety/pre-tm524-track-asset-evidence-scope-corrective-20260816\nCorrective branch         agent/tm524-track-asset-evidence-scope-corrective\nDiagnostic branch         diagnostic/tm523-fresh-draft-asset-upload\nProduction Worker deploy  NONE before exact-head CI + merge\nPublic Worker deploy      NONE planned\nR2 manual mutation        NONE\n```\n\n`CI GREEN != MERGED != ADMIN WORKER DEPLOYED != REAL USER PASS`.\n'''
          new='''## Accepted receipts\n\n```text\nOriginal accepted main    bc82fea12edc7cbd1b7b054c697a553694e76322\nSafety checkpoint         safety/pre-tm524-track-asset-evidence-scope-corrective-20260816\nCorrective PR             #238\nCorrective merge          aaa28c90c95b6d5dbe76e34a840d95e194e0cc65\nDiagnostic run            31916576113 · reproduced ReferenceError\nPlacement proof run       31916652865 · proved declaration in wrong function\nProtected deploy run      31919397012 · SUCCESS · target admin\nTrack Manager             v5.24\nStudio bridge             v1.14\nWorker Version ID         53abb651-4f3c-46a7-a37a-055f35d340b9\nCloudflare Access check   PASS\nPublic Worker deploy      SKIPPED · v2.7 unchanged\nR2 deployment mutation   NONE · deploy did not rebuild catalog/index.json or mutate media\nReal-user verdict         MP3 + COVER + MP4 + TXT PASS MADAFAKA · 2026-08-16\nSafety post-acceptance    safety/post-tm524-real-user-pass-20260816\n```\n\nThe exact fresh-draft regression (`album-track` + transitional `Singles` → first MP3 → first JPEG) passes in the v5.24 bundle, and the genuine `Pixels & Promises` continuation additionally verified MP4 + TXT in production. No automatic write retry was added and the existing rollback/canonical reread safety model remains intact.\n\nTM v5.24 / bridge v1.14 is **REAL USER VERIFIED**.\n'''
          t=ro(t,old,new,'TM receipts')
          write(p,t)
          PY
      - name: Commit only two docs
        shell: bash
        run: |
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add README.md docs/TM-V5.24-TRACK-ASSET-EVIDENCE-SCOPE-CORRECTIVE.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Docs: accept Track Manager v5.24 real-user corrective"
          git push origin HEAD:docs/tm524-real-user-closeout-20260816
