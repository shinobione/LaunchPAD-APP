name: Export worktree

on:
  push:
    branches:
      - refactor/visual-safety-seo-accessibility

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
