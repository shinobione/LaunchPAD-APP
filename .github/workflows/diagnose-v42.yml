name: Diagnose Build 42

on:
  push:
    branches:
      - fix/audio-audiolab-admin-v42

permissions:
  contents: read

jobs:
  catalog-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact npm validate catalog
        id: validate
        shell: bash
        run: |
          set +e
          npm run validate:catalog > npm-validate-catalog.log 2>&1
          STATUS=$?
          echo "$STATUS" > npm-validate-catalog.status
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: build42-npm-validation
          path: |
            npm-validate-catalog.log
            npm-validate-catalog.status
          retention-days: 1
      - name: Fail if exact validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
