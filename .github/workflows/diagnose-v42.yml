name: Diagnose Build 42

on:
  push:
    branches:
      - fix/audio-audiolab-admin-v42

permissions:
  contents: read

jobs:
  catalog-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm catalog-filters
        continue-on-error: true
        run: npm run check:catalog-filters
      - name: npm feature-10
        continue-on-error: true
        run: npm run check:feature-10
      - name: npm feature-11
        continue-on-error: true
        run: npm run check:feature-11
      - name: npm phase-12
        continue-on-error: true
        run: npm run check:phase-12
      - name: npm phase-13
        continue-on-error: true
        run: npm run check:phase-13
      - name: npm milestone-7
        continue-on-error: true
        run: npm run check:milestone-7
      - name: npm navigation-recovery
        continue-on-error: true
        run: npm run check:navigation-recovery
      - name: npm sanctuary-idempotence
        continue-on-error: true
        run: npm run check:sanctuary-idempotence
      - name: npm audio-signal
        continue-on-error: true
        run: npm run check:audiolab-signal
      - name: npm core-modes
        continue-on-error: true
        run: npm run check:audiolab-core-modes
      - name: npm live-reactivity
        continue-on-error: true
        run: npm run check:audiolab-live
      - name: npm desktop-overflow
        continue-on-error: true
        run: npm run check:desktop-overflow
      - name: exact npm validate catalog
        run: npm run validate:catalog
