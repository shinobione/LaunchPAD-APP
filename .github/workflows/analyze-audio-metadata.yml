name: Analyze audio metadata

on:
  push:
    branches:
      - refactor/consolidation-catalog-player-lyrics

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check librosa

      - name: Analyze tracks
        run: python scripts/analyze-audio-metadata.py
