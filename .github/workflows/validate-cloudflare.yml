name: Validate Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate public and private Workers
        run: npm run validate:cloudflare

      - name: Build deployable Track Manager bundle
        run: npm run build:admin-worker

      - name: Verify generated bundle
        run: test -s dist/launchpad-r2-admin-worker.js

      - name: Dry-run both Wrangler deployments
        run: npm run check:wrangler
