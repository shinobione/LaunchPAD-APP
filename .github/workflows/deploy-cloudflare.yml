name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker to deploy from the selected main revision
        required: true
        default: both
        type: choice
        options:
          - both
          - public
          - admin
      confirm:
        description: Type DEPLOY to confirm a production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launchpad-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      DEPLOY_TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_WORKER_URL: https://launchpad-media.jerryquinet.workers.dev
      ADMIN_WORKER_URL: https://launchpad-r2-api.jerryquinet.workers.dev
      EXPECTED_PUBLIC_VERSION: '2.6'
      # Historical validation marker retained for Feature 10 / Milestone 3 ancestry: EXPECTED_ADMIN_VERSION: '5.6'
      EXPECTED_ADMIN_VERSION: '5.8'
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Confirm production deployment
        run: test "${{ inputs.confirm }}" = 'DEPLOY'

      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Checkout selected main revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Worker sources and Wrangler bundles
        run: npm run validate:cloudflare && npm run check:wrangler

      - name: Record deployment request
        run: |
          {
            echo '## LaunchPAD Cloudflare deployment'
            echo
            echo "- Trigger: \`workflow_dispatch\`"
            echo "- Requested target: \`$DEPLOY_TARGET\`"
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Actor: \`$GITHUB_ACTOR\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy private Track Manager Worker
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'admin'
        run: npm run deploy:cloudflare:admin
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-admin.ndjson

      - name: Record private Worker version
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'admin'
        run: node scripts/report-wrangler-deploy.mjs "$RUNNER_TEMP/wrangler-admin.ndjson" admin

      - name: Verify private Worker and Cloudflare Access
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'admin'
        run: node scripts/verify-cloudflare-deployment.mjs admin

      - name: Deploy public media Worker
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'public'
        run: npm run deploy:cloudflare:public
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-public.ndjson

      - name: Record public Worker version
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'public'
        run: node scripts/report-wrangler-deploy.mjs "$RUNNER_TEMP/wrangler-public.ndjson" public

      - name: Verify public catalog and media streaming
        if: env.DEPLOY_TARGET == 'both' || env.DEPLOY_TARGET == 'public'
        run: node scripts/verify-cloudflare-deployment.mjs public

      - name: Complete deployment summary
        if: success()
        run: |
          {
            echo '### Result'
            echo
            echo 'Deployment and post-deployment smoke tests passed.'
            echo
            echo '> This workflow deploys Worker code only. It does not rebuild `catalog/index.json` or mutate R2 media.'
          } >> "$GITHUB_STEP_SUMMARY"
